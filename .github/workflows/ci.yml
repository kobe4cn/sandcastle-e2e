name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv sync && uv run pytest
      - name: CI mode (vars.CI_MODE)
        env:
          CI_MODE: ${{ vars.CI_MODE }}
        run: |
          echo "CI_MODE=$CI_MODE"
          case "$CI_MODE" in
            fail) echo "CI_MODE=fail: failing on purpose"; exit 1 ;;
            slow) echo "CI_MODE=slow: sleeping 300s"; sleep 300 ;;
            *) echo "nothing to do" ;;
          esac
